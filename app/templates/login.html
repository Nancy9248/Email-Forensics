<!DOCTYPE html>
<html>
<head>
    <title>Log In — Email Threat Forensics</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body style="max-width: 400px; padding-top: 100px;">
    <canvas id="bg-canvas"></canvas>
    <div class="mono" style="color: var(--text-dim); font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; text-align:center;">Email Threat Forensics</div>
    <h1 style="text-align:center; font-size: 22px;">Log In</h1>

    {% if error %}
    <div class="alert-banner">{{ error }}</div>
    {% endif %}

    <form method="POST" action="/login" class="panel" style="margin-top: 20px;">
        <input type="hidden" name="next" value="{{ next_url or '' }}">
        <div style="margin-bottom: 12px;">
            <label style="display:block; color: var(--text-secondary); margin-bottom: 4px;">Username</label>
            <input type="text" name="username" required style="width: 100%;">
        </div>
        <div style="margin-bottom: 16px;">
            <label style="display:block; color: var(--text-secondary); margin-bottom: 4px;">Password</label>
            <input type="password" name="password" required style="width: 100%;">
        </div>
        <button type="submit" style="width: 100%;">Log In</button>
    </form>

    <p style="text-align:center; color: var(--text-secondary); font-size: 13px; margin-top: 16px;">
        No account yet? <a href="/signup">Sign up</a>
    </p>
    <script src="{{ url_for('static', filename='network-bg.js') }}"></script>
</body>
</html>
